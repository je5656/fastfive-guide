<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>FASTFIVE 멤버 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<style id="app-css">
/* Layout: dark brand band with search up top, quick tiles, branch facts, then a category rail + article cards; articles open in a reading sheet. */
:root{
  --bg:#ffffff; --surface:#f2f4f7; --surface-2:#e8ebf0; --line:#dfe3e8; --text:#191d23; --muted:#5d636c; --faint:#b6bbc2;
  --band:#191d23; --band-text:#ffffff; --band-muted:#b6bbc2;
  --accent:#ff5e3f; --accent-strong:#e8462a; --accent-soft:#fff0eb; --on-accent:#ffffff;
  --info:#2f5fa8; --info-bg:#edf2fa; --ok:#1d7f55; --ok-bg:#e8f5ee; --warn:#a6500a; --warn-bg:#fff4e4; --danger:#c8371f; --hl:#fff1a8;
  --shadow:0 1px 2px rgba(25,29,35,.06),0 8px 24px rgba(25,29,35,.08);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-brand:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;
  --r:14px; --r-sm:10px; --maxw:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#191c22; --surface-2:#22262d; --line:#2c313a; --text:#eceef1; --muted:#a2a8b1; --faint:#4a5059;
  --band:#1b1f26; --band-text:#ffffff; --band-muted:#a2a8b1;
  --accent:#ff6b4d; --accent-strong:#ff8a70; --accent-soft:#3a1f18; --on-accent:#1a0d09;
  --info:#93b6ee; --info-bg:#18233a; --ok:#5ec99c; --ok-bg:#142a20; --warn:#f2b05a; --warn-bg:#2f240f; --danger:#ff806c; --hl:#5a4d10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#191c22; --surface-2:#22262d; --line:#2c313a; --text:#eceef1; --muted:#a2a8b1; --faint:#4a5059;
  --band:#1b1f26; --band-text:#ffffff; --band-muted:#a2a8b1;
  --accent:#ff6b4d; --accent-strong:#ff8a70; --accent-soft:#3a1f18; --on-accent:#1a0d09;
  --info:#93b6ee; --info-bg:#18233a; --ok:#5ec99c; --ok-bg:#142a20; --warn:#f2b05a; --warn-bg:#2f240f; --danger:#ff806c; --hl:#5a4d10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .word{white-space:nowrap}
.brand .word{font-family:var(--f-brand);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.brand img{height:20px;width:auto}
.brand .sub{font-size:13px;color:var(--muted);white-space:nowrap;padding-left:10px;border-left:1px solid var(--line)}
.top .grow{flex:1}
.branch-pick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 12px;height:40px}
.branch-pick select{border:0;background:transparent;font-weight:600;height:38px;padding-right:4px;max-width:140px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.icon-btn:hover{background:var(--surface)}
.top-link{font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px}
.top-link:hover{background:var(--surface)}

/* hero */
.hero{background:var(--band);color:var(--band-text)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:40px;align-items:center;padding-block:48px 52px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--band-muted)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.22;margin:14px 0 12px;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.hero p.lead{color:var(--band-muted);margin:0 0 26px;max-width:36em}
.search{position:relative;max-width:620px}
.search .box{display:flex;align-items:center;gap:10px;background:#fff;color:#191d23;border-radius:16px;padding:0 8px 0 18px;height:60px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.search .box svg{color:#5d636c}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;color:#191d23}
.search input::placeholder{color:#8a9099}
.search .go{border:0;background:var(--accent);color:#fff;font-weight:600;height:44px;padding:0 18px;border-radius:12px}
.results{position:absolute;left:0;right:0;top:66px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;z-index:30;max-height:min(60vh,460px);overflow-y:auto}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.on{background:var(--surface)}
.results .t{font-weight:600}
.results .s{font-size:14px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .empty{padding:16px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.chips .lbl{font-size:13px;color:var(--band-muted);margin-right:2px}
.chip{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--band-text);border-radius:999px;padding:6px 14px;font-size:14px}
.chip:hover{background:rgba(255,255,255,.1)}
.hero-art{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/4.4;max-width:100%;background:#2a2f37}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.hero-art .tag{position:absolute;left:14px;bottom:14px;background:rgba(25,29,35,.78);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}

/* sections */
main{display:block}
.sec{padding-block:44px 8px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{font-size:24px;margin:0;line-height:1.3;letter-spacing:-.01em}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid transparent;text-align:left;min-height:120px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--bg);color:var(--accent)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:16px;line-height:1.35}
.tile small{color:var(--muted);font-size:13px;line-height:1.4}

.facts{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.fact-list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact dt{color:var(--muted);font-size:14px;font-weight:500}
.fact dd{margin:0;font-weight:500}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:13px;padding:5px 10px;white-space:nowrap}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.notice{border-radius:var(--r);background:var(--accent-soft);padding:20px 22px}
.notice h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--accent-strong)}
.notice .prose{font-size:15px}
.notice .prose p:last-child{margin-bottom:0}
.empty-state{border:1px dashed var(--faint);border-radius:var(--r);padding:22px;color:var(--muted)}

.guide{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted)}
.rail button:hover{background:var(--surface);color:var(--text)}
.rail button.on{background:var(--surface);color:var(--text);font-weight:600}
.rail button .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat{scroll-margin-top:96px;padding-bottom:30px}
.cat + .cat{border-top:1px solid var(--line);padding-top:28px}
.cat h3{font-size:20px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
.cat h3 svg{color:var(--accent)}
.cat > p{margin:0 0 16px;color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:18px 18px 16px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--text);box-shadow:var(--shadow)}
.card .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card b{font-size:17px;line-height:1.4}
.card span.s{color:var(--muted);font-size:14.5px;line-height:1.55}
.card .more{margin-top:auto;padding-top:6px;font-size:13px;font-weight:600;color:var(--accent-strong);display:flex;align-items:center;gap:4px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.badge.br{background:var(--accent-soft);color:var(--accent-strong)}
.badge.hide{background:var(--surface-2)}

.hero .wrap{display:block;padding-block:44px 40px}
.hero-in{max-width:680px}
.hero h1{font-size:clamp(26px,3.6vw,38px)}
.h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.sec{padding-block:36px 4px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;text-align:left;font-weight:600;font-size:15px;transition:border-color .15s}
.qitem svg{color:var(--accent)}
.qitem:hover{border-color:var(--text)}
.nbar{display:flex;align-items:flex-start;gap:8px;background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14.5px;margin-bottom:10px}
.nbar svg{color:var(--accent-strong);width:18px;height:18px;margin-top:2px}
.kcard{border:1px solid var(--line);border-radius:var(--r)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kf{display:flex;flex-direction:column;gap:4px;padding:16px 18px;position:relative;min-width:0}
.kgrid .kf + .kf{border-left:1px solid var(--line)}
.kmore{border-top:1px solid var(--line)}
.kmore .kgrid .kf:nth-child(3n+1){border-left:0}
.kl{font-size:13px;color:var(--muted)}
.kv{font-weight:500;line-height:1.5}
.kf .copy{align-self:flex-start;margin-top:4px}
.ktoggle{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:11px;font-size:14px;font-weight:600;color:var(--muted);border-radius:0 0 var(--r) var(--r)}
.ktoggle:hover{color:var(--text);background:var(--surface)}
.ctabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px;padding-bottom:2px}
.ctabs button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:500;font-size:15px;color:var(--muted)}
.ctabs button[aria-selected="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.trow{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:16px 4px;font-size:16px;font-weight:500}
.trow .tt{flex:1;min-width:0}
.trow svg.chev{width:16px;height:16px;color:var(--faint);transition:transform .15s,color .15s}
.trow:hover .tt{color:var(--accent-strong)}
.trow:hover svg.chev{color:var(--accent);transform:translateX(3px)}
.onb-box{background:var(--surface);border-radius:18px;padding:22px 24px}
.onb-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.onb-h .h2{margin:0}.onb-h p{margin:0;color:var(--muted);font-size:14.5px}
.onb-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.onb-steps button{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid transparent;background:var(--bg);border-radius:12px;padding:14px}
.onb-steps button:hover{border-color:var(--accent)}
.onb-steps .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 13px/24px var(--f-brand);text-align:center}
.onb-steps b{font-size:15px;line-height:1.35}
.onb-steps .d{font-size:13px;color:var(--muted);line-height:1.45}
.cdesc{margin:6px 0 4px;color:var(--muted);font-size:14px}
.trow{align-items:flex-start}
.trow{min-width:0;max-width:100%}
.trow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trow .tt{font-weight:600}
.trow .ts{font-size:14px;color:var(--muted);font-weight:400;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow svg.chev{margin-top:4px}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:16px 4px;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q";font:700 15px/1 var(--f-brand);color:var(--accent);margin-right:2px}
.faq summary{justify-content:flex-start}
.faq summary svg.pm{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .15s}
.faq details[open] summary svg.pm{transform:rotate(45deg)}
.faq .fa{padding:0 4px 16px 24px;font-size:15px}
.faq .fa p:last-child{margin-bottom:0}
.faqmore{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
/* ===== shell layout (sidebar + main) ===== */
.wrap.wide{max-width:1360px}
.top .menu{display:none}
.search.small{width:min(320px,32vw);position:relative}
.search.small .box{height:40px;border-radius:999px;box-shadow:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px}
.search.small input{font-size:14.5px;color:var(--text)}
.search.small .results{top:46px;min-width:340px}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:44px;align-items:start;padding-block:28px 0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);max-height:calc(100vh - 108px);overflow-y:auto;scrollbar-width:thin;padding-bottom:24px}
.side-in{display:flex;flex-direction:column;gap:6px}
.sbranch{background:var(--surface);border-radius:16px;padding:18px 18px 8px;margin-bottom:12px}
.sbranch .kick{font-size:12px;font-weight:600;color:var(--accent-strong);letter-spacing:.04em}
.sbranch h2{font-size:21px;margin:2px 0 10px;letter-spacing:-.01em}
.sf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.sf .sl{grid-column:1/-1;font-size:12px;color:var(--muted)}
.sf .sv{font-weight:500;line-height:1.45;min-width:0}
.sf .copy{padding:3px 8px;font-size:12px}
.slink{display:flex;align-items:center;gap:4px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;padding:11px 0 9px;font-size:13.5px;font-weight:600;color:var(--accent-strong)}
.slink svg{width:15px;height:15px}
.snav{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.sitem{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font-weight:600;font-size:15.5px}
.sitem:hover{background:var(--surface)}
.sitem.on{background:var(--text);color:var(--bg)}
.sgroup-h{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;padding:12px 12px 4px;border-top:1px solid var(--line)}
.scat-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font-weight:700;font-size:16px}
.scat-h:hover{background:var(--surface)}
.scat-h > svg:first-child{color:var(--accent)}
.scat-h span{flex:1}
.scat-h .car{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.scat.open .scat-h .car{transform:rotate(90deg)}
.scat ul{list-style:none;margin:2px 0 8px 22px;padding:0 0 0 12px;border-left:1px solid var(--line)}
.scat li button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;font-size:14.5px;color:var(--muted);line-height:1.4}
.scat li button:hover{color:var(--text);background:var(--surface)}
.scat li button.on{color:var(--accent-strong);font-weight:600;background:var(--accent-soft)}
.main{min-width:0;padding-bottom:20px}
.main .hero{border-radius:22px;padding:40px clamp(20px,4vw,48px) 36px}
.main .sec{padding-block:34px 0}
.main .nbar{margin-top:16px}
.main .tlist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumb button{border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:14px}
.crumb button:hover{color:var(--text);text-decoration:underline}
.crumb svg{width:13px;height:13px}
.crumb span{color:var(--text);font-weight:500}
.ptitle{font-size:clamp(26px,3.2vw,34px);line-height:1.28;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.lede{font-size:17px;color:var(--muted);margin:0 0 26px}
.doc{max-width:820px}
.doc .prose{font-size:16.5px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px;max-width:820px}
.pn button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px}

.shell.noside{grid-template-columns:minmax(0,1fr)}

.sgroup-h{display:flex;align-items:center;justify-content:space-between}

.hgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.hinfo,.hsteps{border:1px solid var(--line);border-radius:18px;padding:24px}
.hinfo .ptitle{font-size:28px;margin-bottom:12px}

.steps2 .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 14px/28px var(--f-brand);text-align:center}
.steps2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.steps2 .more{flex:none;display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--accent-strong);padding:6px 2px}

@media (max-width:1100px){.hgrid{grid-template-columns:1fr}}
@media (max-width:640px){.msearch{display:block}.hinfo,.hsteps{padding:18px 16px}.steps2 li{align-items:flex-start;flex-wrap:wrap}.steps2 .more{margin-left:42px;padding:0}}
.onb-banner{display:flex;align-items:center;gap:20px;width:100%;margin-top:16px;border:0;text-align:left;background:var(--accent-soft);border-radius:18px;padding:14px 24px 14px 14px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.onb-banner:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.onb-banner:hover .ob-cta{background:var(--accent-strong)}
.onbm .box{width:min(680px,100%);max-height:calc(100vh - 32px);overflow-y:auto;position:relative;padding:28px}
.onbm .mx{position:absolute;right:16px;top:16px}
.onbm-h{display:flex;align-items:center;gap:18px;margin:0 40px 20px 0}
.onbm-h img{width:96px;height:86px;object-fit:contain;background:var(--accent-soft);border-radius:14px;flex:none}
.onbm-h h3{font-size:21px;margin:2px 0 4px;line-height:1.35}
.onbm-h p{margin:0;font-size:14px}
.onbm .steps2 li{background:var(--surface)}
.sf .car2,.slink .car2{width:15px;height:15px;transition:transform .15s}
.slink .car2.up{transform:rotate(180deg)}

@media (max-width:640px){.onb-banner{flex-wrap:wrap;padding:14px}.onb-banner img{width:84px;height:76px}.onb-banner b{font-size:17px}.onb-banner .ob-cta{width:100%;justify-content:center}.onbm .box{padding:22px 18px}.onbm-h img{width:72px;height:64px}}
/* footer */
.foot{margin-top:56px;background:var(--band);color:var(--band-muted);font-size:14px}
.foot .wrap{padding-block:40px calc(40px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.foot .word{font-family:var(--f-brand);font-weight:700;color:var(--band-text);font-size:22px;letter-spacing:.02em}
.foot img{height:20px;filter:invert(1)}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.foot a{color:var(--band-text);text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
.admin-entry{border:0;background:transparent;color:var(--band-muted);display:inline-flex;align-items:center;gap:6px;padding:4px 0;font-size:13px}
.admin-entry:hover{color:var(--band-text)}
.admin-entry svg{width:14px;height:14px}

/* prose (article body) */
.prose{font-size:16px;line-height:1.75}
.prose > *:first-child{margin-top:0}
.prose h2{font-size:22px;margin:30px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--text);line-height:1.35}
.prose h3{font-size:18px;margin:26px 0 8px;line-height:1.4}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:22px}
.prose li{margin:4px 0}
.prose a:not(.btn-link){color:var(--accent-strong);text-underline-offset:3px}
.prose blockquote{margin:0 0 16px;padding:4px 0 4px 16px;border-left:3px solid var(--faint);color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.prose hr.thick{border-top:3px solid var(--text)}
.prose figure{margin:18px 0;background:var(--surface);border-radius:var(--r);padding:16px;text-align:center}
.prose figure img{max-height:440px;width:auto;max-width:100%;border-radius:8px;display:inline-block}
.prose figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.prose img{max-width:100%;height:auto}
.prose .tbl-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r-sm)}
.prose table{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;vertical-align:top}
.prose tr:last-child th,.prose tr:last-child td{border-bottom:0}
.prose thead th{background:var(--surface);font-weight:600;font-size:14px}
.prose tbody th{background:var(--surface);font-weight:600;width:28%;white-space:nowrap}
.prose td + td,.prose th + td,.prose th + th{border-left:1px solid var(--line)}
.prose table.num td{font-variant-numeric:tabular-nums}
.prose .callout{border-radius:var(--r-sm);padding:14px 16px 14px 46px;margin:0 0 18px;position:relative;background:var(--surface)}
.prose .callout::before{content:"i";position:absolute;left:16px;top:15px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-brand);background:var(--text);color:var(--bg)}
.prose .callout p:last-child{margin-bottom:0}
.prose .callout.info{background:var(--info-bg)}.prose .callout.info::before{background:var(--info)}
.prose .callout.tip{background:var(--ok-bg)}.prose .callout.tip::before{content:"✓";background:var(--ok)}
.prose .callout.warn{background:var(--warn-bg)}.prose .callout.warn::before{content:"!";background:var(--warn)}
.prose ol.steps{list-style:none;padding:0;counter-reset:st;margin:0 0 18px;display:grid;gap:10px}
.prose ol.steps > li{counter-increment:st;position:relative;padding:2px 0 2px 44px;margin:0;min-height:30px}
.prose ol.steps > li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 14px/30px var(--f-brand);text-align:center}
.prose .path{display:inline-block;background:var(--surface-2);border-radius:6px;padding:0 7px;font-size:.92em;font-weight:500;white-space:nowrap}
.prose .kbd{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.9em;font-weight:600}
.prose .example{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px}
.btn-link{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:15px;border-radius:999px;padding:10px 20px;margin:2px 6px 6px 0;border:1.5px solid var(--accent)}
.btn-link:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-link.ghost{background:transparent;color:var(--text);border-color:var(--text)}
.btn-link.ghost:hover{background:var(--surface)}
.btn-link.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.c-accent{color:var(--accent-strong)}.c-ink{color:var(--text)}.c-muted{color:var(--muted)}.c-blue{color:var(--info)}.c-green{color:var(--ok)}.c-red{color:var(--danger)}
.hl-yellow{background:var(--hl);padding:0 2px;border-radius:3px}.hl-accent{background:var(--accent-soft);padding:0 2px;border-radius:3px}
.al-center{text-align:center}

/* reader sheet */
.sheet{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end;background:rgba(17,19,23,.45)}
.sheet .panel{width:min(760px,100%);height:100%;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 28px;border-bottom:1px solid var(--line);z-index:2}
.sheet .bar .crumb{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet article{padding:28px 32px 40px}
.sheet h1{font-size:clamp(24px,3.4vw,30px);line-height:1.3;margin:10px 0 8px;text-wrap:balance}
.sheet .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px;color:var(--muted);font-size:13px}
.sheet .lede{font-size:17px;color:var(--muted);margin:0 0 22px}
.related{border-top:1px solid var(--line);margin-top:30px;padding-top:20px}
.related h4{margin:0 0 10px;font-size:15px}
.related button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid var(--line);gap:8px;align-items:center;font-weight:500}
.related button:hover{color:var(--accent-strong)}
.ask{margin-top:24px;background:var(--surface);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ask p{margin:0;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* chat */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:0 22px 0 16px;height:58px;font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(255,94,63,.38)}
.fab:hover{background:var(--accent-strong)}
.fab svg{width:24px;height:24px}
.chat{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:66;width:390px;max-width:calc(100vw - 32px);height:min(620px,calc(100vh - 130px));background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(17,19,23,.28);display:flex;flex-direction:column;overflow:hidden}
.chat header{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:var(--band);color:var(--band-text)}
.chat .av{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font:800 18px/1 var(--f-brand);color:#fff;flex:none}
.chat header b{display:block;font-size:15px}
.chat header small{color:var(--band-muted);font-size:12px}
.chat header .icon-btn{margin-left:auto;background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.chat .log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.55}
.msg.bot{background:var(--bg);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--text);color:var(--bg);border-top-right-radius:6px;align-self:flex-end}
.msg .prose{font-size:15px;line-height:1.6}
.msg .prose p{margin:0 0 6px}.msg .prose p:last-child{margin:0}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:100%}
.qr button{border:1px solid var(--accent);color:var(--accent-strong);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.qr button:hover{background:var(--accent-soft)}
.contact-card{display:grid;gap:8px}
.contact-card .row{display:flex;gap:8px;font-size:14px}
.contact-card .row span:first-child{color:var(--muted);min-width:58px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--bg)}
.chat form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;background:var(--bg)}
.chat form button{border:0;background:var(--accent);color:#fff;border-radius:12px;width:44px;height:44px;display:grid;place-items:center}
.chat .disc{font-size:11.5px;color:var(--muted);text-align:center;padding:0 12px 10px;background:var(--bg)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(17,19,23,.5);padding:16px}
.modal .box{width:min(440px,100%);background:var(--bg);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 6px;font-size:19px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input[type=checkbox],.field input[type=radio],.checks input{width:auto;flex:none}
.checks label{white-space:nowrap}
.field .hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13.5px;margin-top:-4px}

/* admin */
.admin{position:fixed;inset:0;z-index:100;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.admin .abar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--band);color:var(--band-text);flex-wrap:wrap}
.admin .abar h2{margin:0;font-size:16px;display:flex;align-items:center;gap:10px}
.admin .abar .word{font-family:var(--f-brand);font-weight:700;letter-spacing:.02em}
.admin .abar .state{font-size:13px;color:var(--band-muted)}

.admin .abar .sp{flex:1}
.admin .abar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.admin .abar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.admin .abody{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.admin nav.tabs{background:var(--bg);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}

https://members.fastfive.co.kr/\" target=\"_blank\" rel=\"noopener\">웹으로 이용하기\u003c/a>\u003c/p>", "quickLabel": "앱 설치·가입", "scope": "all", "keywords": "앱 다운로드 설치 플레이스토어 앱스토어 회원가입 가입 아이폰 안드로이드", "quick": true, "icon": "app", "visible": true, "updated": "2026-10-24"}, {"id": "group-join", "cat": "start", "title": "소속 그룹 등록", "summary": "초대 링크로 승인 요청하면 소속이 확정돼요", "body": "\u003cp>앱을 설치했다면 회사(입주사) 그룹에 소속되어야 출입카드·예약 등 멤버 기능을 쓸 수 있어요.\u003c/p>\n\u003col class=\"steps\">\u003cli>\u003cstrong>초대 링크 접속\u003c/strong> · 사내 담당자 또는 커뮤니티 매니저에게 받은 초대 링크를 열어 주세요.\u003c/li>\u003cli>\u003cstrong>승인 요청\u003c/strong> · 표시된 그룹명이 맞는지 확인하고 \u003cspan class=\"path\">승인 요청\u003c/span>을 눌러요.\u003c/li>\u003cli>\u003cstrong>소속 확정\u003c/strong> · “본인의 소속이 맞으신가요?” 창에서 \u003cspan class=\"path\">확인\u003c/span>을 누르면 소속이 확정돼요.\u003c/li>\u003cli>\u003cstrong>승인 완료\u003c/strong> · 그룹 관리자가 승인하면 바로 이용할 수 있어요.\u003c/li>\u003c/ol>\n\u003cfigure>\u003cimg src=\"data:image/webp;base64,UklGRvA4AABXRUJQVlA4IOQ4AABwkwGdASpQAygDPpVKn0wlpCMiIdJ6oLASiWlu5VwxT33Tu2eUaYBuVSIm4cipKb73+l9bO3T8wHnZf3b1AeeZ1HPoAeXD+tfwx5DL5b/zH9t9i/hR+Y/u/jz5DPaHul7DGQPsG1Kfl33d/X/3v2tfzH/M/yvi78lP8T+7+wL+Vf0z/Zf3Hf290/0//Y/y/sEezH1L/p/47/Oewj8//x/Rz7F/8H7pfsB/pn9y/8XHXeo+wH/T/8z+1vu4/3//0/2Ppd+rf/f/t/gX/o398664+8mM36M5c/yQPhtCCYXlJaDtvY6j9a0FB23scOkL792C76GFuUCI0D64v34eYYgIl5+MJ3YObQUHbex1H61oKDts9HBII6HtXhVbHfpkl8dsvhv8DrusYiQegI7LZ2K9Ns39TMwzcqGYZuLE6IYu9pjGWX26Q9vPdyM21/bctDw9FOdrrVZkl3k4lhNVDMM3KhmGblQzDNyoZafpeEOg/f/FVcWPftAv6IV88pJKCWlx7aqH76FUuYyduyEOqq8rkxrEAjvGp1DPOg3GNgzueZFq054U0f/uo86a8j25Mzqo+jcc1RFy+xam2hqeGAhVqSiu/HEVAngCZrh2q4js9nnQbjoPkQXCEXw2pbLqzi4vc1Ilim6UoMhLiDx7xW4UpfNaDkRFpZU36BXh7h0hFV6qB0IABHz+vhJFbAkx8/V2rz0R59Nvsd0lgYo4Dc6IFFANUng0+235mQGNV4Nx0EVOWaQM16GuZkTqQEY6PGutXZnz6XscdCAAR9Bw5kWbDm624sWDBd7o0IABH0G5jCftmF5W86DcdCAAR9BuNGbDm7Zg2FZnnQbjoQACPkpHrUveAm46EAAj6Dcc3a/QWBF8ABH0G46EAAj6AC7BDaEAAj6DcdCAAR8lInQAYWiNBH0G46EAAj6AC7BDaEAAj6DcdCAAR8lInQAYWiNBH0G46EAAj6AC7BBQXK4nE0Ex+3ntgcnjUv16N1JSgnTX/Yz6geVywZvOg3  않게 되면 \u003cspan class=\"path\">내 계정\u003c/span> &gt; \u003cspan class=\"path\">예약 내역\u003c/span>에서 꼭 취소해 주세요. 다른 멤버가 쓸 수 있어요.\u003c/p>\u003c/div>\n\u003cp>미팅룸에서는 \u003cstrong>물·커피 등 음료만\u003c/strong> 드실 수 있어요.\u003c/p>", "quickLabel": "미팅룸 예약", "scope": "all", "keywords": "미팅룸 회의실 예약 취소 크레딧 공간 예약 미팅부스", "quick": true, "icon": "calendar", "visible": true, "updated": "2026-10-24"}, {"id": "s5-meeting-rule", "cat": "space", "title": "미팅룸 이용 규칙", "summary": "개인당 하루 최대 3시간, 미팅룸은 음료만", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>개인 이용 한도\u003c/th>\u003ctd>각 회의실은 개인당 \u003cstrong>하루 최대 3시간\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>그룹 이용\u003c/th>\u003ctd>멤버 그룹 단위 최대 예약 시간 제한 없음\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>B2층 14인 미팅룸\u003c/th>\u003ctd>L2A(8인) + L2B(6인)를 폴딩 도어로 합쳐 사용해요. 이용하려면 공간 예약 후 \u003cstrong>지점 매니저에게 미리 공유\u003c/strong>해 주세요.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>취식\u003c/th>\u003ctd>음료만 가능 · 취식이 확인되면 이용이 제한될 수 있어요\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>크레딧 활용하기\u003c/h3>\n\u003cp>보유한 \u003cstrong>크레딧\u003c/strong>(11월 20일부터 유료분은 \u003ca href=\"#credit\">패파머니\u003c/a>로 표시)으로 미팅룸 등 공용 공간을 예약할 수 있어요. 미팅룸은 내부 회의뿐 아니라 외부 손님 응대, 화상 회의에도 쓰기 좋아요. 미팅부스는 완전히 분리된 공간은 아니지만 잠깐 환기하며 일하기 좋아요.\u003c/p>\n\u003cp>\u003cspan class=\"path\">앱\u003c/span> &gt; \u003cspan class=\"path\">예약\u003c/span> &gt; \u003cspan class=\"path\">공간 유형 선택\u003c/span> 후 예약\u003c/p>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "미팅룸 규칙 3시간 크레딧 14인 L2A L2B 폴딩 지하2층 회의실", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "credit", "cat": "space", "title": "크레딧·패파머니", "summary": "11/20부터 유료 크레딧은 패파머니, 잔액은 그대로", "body": "\u003cdiv class=\"callout tip\">\u003cp>\u003cstrong>이름만 바뀌고, 잔액과 사용 방법은 그대로예요.\u003c/strong> 따로 신청하거나 옮길 필요가 없어요.\u003c/p>\u003c/div>\n\u003cp>\u003cstrong>2026년 11월 20일(금)\u003c/strong>부터 유료 크레딧과 무료 크레딧이 나뉘어 표시되고, 이름이 아래처럼 바뀌어요.\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>지금\u003c/th>\u003cth>11월 20일부터\u003c/th>\u003cth>사용처\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>유료 크레딧\u003c/td>\u003ctd>\u003cstrong class=\"c-accent\">패파머니\u003c/strong>\u003c/td>\u003ctd>패스트파이브 공간·서비스 + 패파오더 제휴 상품(주차권·스낵바 등)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>무료 크레딧\u003c/td>\u003ctd>\u003cstrong>크레딧\u003c/strong>\u003c/td>\u003ctd>패스트파이브 공간·서비스\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>달라지는 점\u003c/h3>\n\u003cul>\u003cli>앱에서 \u003cstrong>패파머니와 크레딧 잔액이 따로\u003c/strong> 보여요.\u003c/li>\u003cli>기존 유료 크레딧 잔액은 \u003cstrong>같은 수량의 패파머니로 자동 전환\u003c/strong>돼요.\u003c/li>\u003cli>\u003cspan class=\"hl-yellow\">\u003cstrong>보유 한도 신설\u003c/strong>\u003c/span> · 패파머니는 \u003cstrong>멤버그룹당 최대 180\u003c/strong>까지 보유할 수 있고, 180을 넘는 충전은 되지 않아요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout info\">\u003cp>한 번에 큰 금액이 필요하다면 \u003cstrong>자동결제\u003c/strong>를 이용할 수 있어요. 자세한 방법은 \u003ca href=\"#inquiry\">1:1 문의\u003c/a>로 알려 드려요.\u003c/p>\u003c/div>\n\u003ch3>크레딧 사용 기준\u003c/h3>\n\u003cp>미팅룸 등 공용 공간 예약에 쓸 수 있어요. 기본 차감은 \u003cstrong>30분당 1크레딧\u003c/strong>이고, 공간 크기와 시간대(평일 피크타임 등)에 따라 달라질 수 있어요. 예약 화면에서 차감 크레딧을 먼저 확인해 주세요.\u003c/p>\n\u003cp>\u003cspan class=\"path\">앱\u003c/span> &gt; \u003cspan class=\"path\">예약\u003c/span> &gt; \u003cspan class=\"path\">공간 유형 선택\u003c/span> 후 예약\u003c/p>\n\u003cp>\u003ca class=\"btn-link\" href=\"https://credit-guide.fastfive.co.kr/\" target=\"_blank\" rel=\"noopener\">크레딧 공식 가이드북\u003c/a>\u003c/p>", "quickLabel": "", "scope": "all", "keywords": "크레딧 패파머니 유료크레딧 무료크레딧 충전 잔액 한도 180 패파오더 주차권 스낵바 자동결제 포인트", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-floors", "cat": "space", "title": "층별 공간", "summary": "짝수층 미팅룸, 홀수층 서브 라운지·폰부스", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>층\u003c/th>\u003cth>주요 시설\u003c/th>\u003c/tr>\u003c/t el": "", "scope": ["seolleung5"], "keywords": "취식 음식 점심 먹어도 식사 라운지 음식물 쓰레기 도시락", "quick": false, "icon": "food", "visible": true, "updated": "2026-10-24"}, {"id": "s5-fridge", "cat": "space", "title": "냉장고 이용", "summary": "보관 기한 스티커 부착, 매주 금요일 정리", "body": "\u003col class=\"steps\">\u003cli>\u003cstrong>스티커 작성\u003c/strong> · 냉장고 문 쪽 서랍통의 \u003cstrong>보관 기한 스티커\u003c/strong>에 호실 번호와 보관 기한을 적어요.\u003c/li>\u003cli>\u003cstrong>부착 후 보관\u003c/strong> · 음식물에 스티커를 붙여 보관해 주세요.\u003c/li>\u003c/ol>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>정기 청소일\u003c/th>\u003ctd>매주 \u003cstrong>금요일 18시\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>폐기 대상\u003c/th>\u003ctd>보관 기한이 없거나 지난 식품 · 스티커가 없는 식품 · 기한 임박 스티커가 붙은 식품\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cp>금요일 청소 때 \u003cstrong>기한 임박 스티커\u003c/strong>가 붙어요. 계속 보관하려면 임박 스티커를 떼고 새 보관 기한 스티커로 바꿔 붙여 주세요.\u003c/p>\u003c/div>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "냉장고 보관 스티커 음식 폐기 금요일", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-aircon", "cat": "space", "title": "냉난방 조절", "summary": "자동출입문 옆 컨트롤러로 조절", "body": "\u003cul>\u003cli>사무공간 안에 컨트롤러가 없다면 \u003cstrong>각 층 자동출입문 옆 컨트롤러\u003c/strong>로 조절할 수 있어요.\u003c/li>\u003cli>냉방과 난방을 동시에 켜면 시스템 오류가 발생해, \u003cstrong>냉·난방 모드는 중앙에서 제어\u003c/strong>하고 있어요.\u003c/li>\u003c/ul>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "냉방 난방 에어컨 히터 온도 덥다 춥다 컨트롤러", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-doorlock", "cat": "space", "title": "사무실 도어락 설정", "summary": "비밀번호·자동잠금·버튼 음량 변경", "body": "\u003cp>도어락 모델: \u003cstrong>에버넷 LH310\u003c/strong>\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>설정\u003c/th>\u003cth>방법 (뒤 커버를 연 상태)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cstrong>비밀번호 변경\u003c/strong>\u003c/td>\u003ctd>동그란 입력버튼(☜) → 새 비밀번호 입력 → \u003cspan class=\"kbd\">*\u003c/span> → “딩동댕” 소리로 완료\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>자동잠금\u003c/strong>\u003c/td>\u003ctd>입력버튼(☜) → \u003cspan class=\"kbd\">#\u003c/span> → 입력버튼(☜) → “딩동댕” 소리\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>수동잠금\u003c/strong>\u003c/td>\u003ctd>입력버튼(☜) → \u003cspan class=\"kbd\">#\u003c/span> → 입력버튼(☜) → “삑” 소리\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>버튼 음량\u003c/strong>\u003c/td>\u003ctd>입력버튼(☜) → \u003cspan class=\"kbd\">1\u003c/span> \u003cspan class=\"kbd\">3\u003c/span> \u003cspan class=\"kbd\">*\u003c/span> 순서로 → \u003cspan class=\"kbd\">1\u003c/span> 반복 시 작게 / \u003cspan class=\"kbd\">3\u003c/span> 반복 시 크게\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "도어락 비밀번호 변경 자동잠금 수동잠금 음량 사무실 문", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-wifi", "cat": "it", "title": "Wi-Fi·유선 인터넷", "summary": "FASTFIVE_5G · five0401, 유선은 벽면 랜 포트", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>네트워크 이름\u003c/th>\u003ctd>\u003cstrong>FASTFIVE_5G\u003c/strong> (연결이 불안정하면 \u003cstrong>FASTFIVE_2.4G\u003c/strong>)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>비밀번호\u003c/th>\u003ctd>\u003cstrong class=\"c-accent\">five0401\u003c/strong> (전 층 동일)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>방문객\u003c/th>\u003ctd>멤버가 아닌 방문객은 \u003cstrong>Guest Wi-Fi\u003c/strong>를 안내해 주세요\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>유선 인터넷\u003c/h3>\n\u003cp>사무실 벽면의 \u003cstrong>랜 포트\u003c/strong>에 랜선을 연결하면 바로 쓸 수 있어요. 랜선·멀티탭 대여가 필요하면 앱 \u003cspan class=\"path\">1:1 문의하기\u003c/span>로 품목과 수량을 알려 주세요. 대여 비품이 \u003cstrong>파손·분실되면 비용이 청구\u003c/strong>돼요.\u003c/p>\n\u003cdiv class=\"callout info\">\u003cp>복합기로 출력하려면 \u003cstrong>복합기가 있는 층의 FASTFIVE 네트워크\u003c/strong>에 연결되어 있어야 해요. Guest Wi-Fi, 개인 공유기, 핫스팟, VPN에서는 출력되지 않아요.\u003c/p>\u003c/div>", "quickLabel": "Wi-Fi 비밀번호", "scope": ["seolleung5"], "keywords": "와이파이 wifi 와이파이 비밀번호 인터넷 랜 유선 네트워크 게스트", "quick": true, "icon": "wifi", "visible": true, "updated": "2026-10-24"}, {"id": "mfp-start", "cat": "it", "title": "복합기 이용·흑백 출력", "summary": "흑백은 데스크당 월 200장 무료, 초과분 후불", "body": "\u003ch3>요금 한눈에 보기 \u003cspan class=\"badge br\">2026년 6월 1일 시행\u003c/span>\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>요금\u003c/th>\u003cth>준비할 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cstrong>흑백 출력·복사\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"c-green\">\u003cstrong>계약 데스크당 월 200장 무료\u003c/strong>\u003c/span> (A4 기준)\u003cbr>초과분은 후불 청구\u003c/td>\u003ctd>앱에서 복합기 계정 등록 + PC 프로그램 설치\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>컬러 출력·복사\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"c-accent\">\u003cstrong>A4 100원 · A3 200원\u003c/strong>\u003c/span> (VAT 별도)\u003cbr>등록한 결제카드로 즉시 결제\u003c/td>\u003ctd>위 준비 + \u003ca href=\"#mfp-color\">결제카드 등록\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>스캔·팩스\u003c/strong>\u003c/td>\u003ctd>무료 장수 계산에서 제외\u003c/td>\u003ctd>\u003ca href=\"#mfp-functions\">복사·스캔·팩스 하는 법\u003c/a> 참고\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>흑백 무료 장수 기준\u003c/h3>\n\u003cul>\u003cli>무료 장수는 \u003cstrong>계약한 데스크(인실) 수 기준\u003c/strong>으로 회사 단위로 제공돼요. 예를 들어 \u003cstrong>10인실 계약이면 매월 흑백 2,000장\u003c/strong>(A4 기준)이 무료예요.\u003c/li>\u003cli>\u003cstrong>프린트와 복사\u003c/strong>가 모두 포함되고, \u003cstrong>스캔·팩스\u003c/strong>는 포함되지 않아요.\u003c/li>\u003cli>\u003cstrong>A3\u003c/strong>는 A4 \u003cstrong>2장\u003c/strong>으로 계산돼요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl num\">\u003cthead>\u003ctr>\u003cth>무료 장수 초과 시 (흑백)\u003c/th>\u003cth>1장당 요금\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>A4\u003c/td>\u003ctd>\u003cstrong>10원\u003c/strong> (VAT 별도)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>A3\u003c/td>\u003ctd>\u003cstrong>20원\u003c/strong> (VAT 별도)\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"c-muted\">초과분은 사용한 만큼 \u003cstrong>월말 기준 후불로 청구\u003c/strong>돼요. 초과했다고 바로 결제되지는 않아요.\u003c/p>\n\u003cdiv class=\"callout tip\">\u003cp>\u003cstrong>이번 달 사용량 확인\u003c/strong> · \u003ca href=\"https://print.fastfive.co.kr\" target=\"_blank\" rel=\"noopener\">print.fastfive.co.kr\u003c/a> 로그인 후 \u003cspan class=\"path\">내 작업 이력\u003c/span> &gt; \u003cspan class=\"path\">상세보기\u003c/span>에서 월별 사용량을 볼 수 있어요.\u003c/p>\u003c/div>\n\u003cp>\u003ca class=\"btn-link ghost\" href=\"#mfp-color\">컬러 출력 방법 보기\u003c/a>\u003c/p>\n\u003cdiv class=\"callout warn\">\u003cp>복합기는 \u003cstrong>패스트파이브 앱 가입과 그룹 승인이 완료\u003c/strong>되어야 이용할 수 있어요.\u003c/p>\u003c/div>\n\u003ch3>흑백 출력 시작하기\u003c/h3>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>앱에서 복합기 계정 등록\u003c/strong> · \u003cspan class=\"path\">내 계정\u003c/span> &gt; \u003cspan class=\"path\">설정\u003c/span> &gt; \u003cspan class=\"path\">복합기 계정 등록\u003c/span>에서 복합기 전용 비밀번호를 등록해요.\u003c/li>\n\u003cli>\u003cstrong>문서관리 시스템 접속\u003c/strong> · 사용할 PC에서 \u003ca href=\"https://print.fastfive.co.kr\" target=\"_blank\" rel=\"noopener\">print.fastfive.co.kr\u003c/a>에 로그인해요.\u003cbr>ID: 앱 ID(이메일) / PW: 1단계에서 등록한 복합기 전용 비밀번호\u003c/li>\n\u003cli>\u003cstrong>프로그램 설치\u003c/strong> · \u003cspan class=\"path\">Help Desk\u003c/span> &gt; \u003cspan class=\"path\">매뉴얼 및 드라이버 다운로드\u003c/span>에서 운영체제(Windows·Mac)에 맞는 설치 프로그램을 내려받아 설치해요. Windows는 마우스 오른쪽 클릭 후 \u003cstrong>관리자 권한으로 실행\u003c/strong>해 주세요.\u003c/li>\n\u003cli>\u003cstrong>신도리코 MPS 프로그램 로그인\u003c/strong> · \u003cspan class=\"path\">Sindoh Cloud MPS\u003c/span>를 실행해 같은 ID/PW로 로그인해요. 최초 출력 시 1~2회 계정 입력이 필요할 수 있어요.\u003c/li>\n\u003cli>\u003cstrong>PC에서 출력\u003c/strong> · 프린터를 \u003cspan class=\"c-accent\">\u003cstrong>Sindoh Cloud MPS (Black)\u003c/strong>\u003c/span>으로 선택해 인쇄해요.\u003c/li>\n\u003cli>\u003cstrong>복합기에서 출력\u003c/strong> · 복합기 카드 리더기에 모바일 출입카드를 태그해 로그인한 뒤 \u003cspan class=\"path\">출력 리스트\u003c/span>에서 문서를 출력해요.\u003c/li>\n\u003c/ol>\n\u003cfigure>\u003cimg src=\"data:image/webp;base64,UklGRnghAABXRUJQVlA4IGwhAACQygCdASq8Ap8BPpFGn0ulo6KhodK54LASCWVu/B25TVdW/6a+dHcWwj/su/rlH5D/C7u9Rzuf+X8Z/4nv3/7/2Ef4/0nOjt5mf19/Zn3mPSx6AH6u+tr/1PZ//tfqAfsN6z//m/cz4iv7d/0/S91WXyj/Xe0f+9f3Xxx/H/nH8F+Y/989tPIP2ManHyv7Q/kv7f6C/9X/BeLvw3/s/UF/Mv5r/lu9w7jPZ/9F+tPsC+u/0z/cf4T8rfSO/zP8B6m/oH98/4nuAfzz+zennfzeh+wN/Rv8v+znuz/2n/x/zH+r/cr3bfVv/n/znwKfzz+7f97srC4ZTTD3Q7KaYe6HZTTD3Q7KaYe6HZRVa8czhI9DLhVfoQ/mHN6r6DG22mE5NP5o43qr/dnn/h5exNxvVX3lmBWpo3K1QZvRMg3f+HjXh3J5STaFaPwXDz82vKHfOxVIAnsJm9Z2jsE+6teRV7Y37iebYpoS7lTNMlK3R8B95657KpbexYOlyWkYCLXa9KZUZTTD3Q7KaYe6HZEHfchcvsk+qRb7Gh4auGWUBcQyDaheoJY8aN5nmuorBTEHgRph7odlNMbY3UCZ2mzVHhCb5NP5o43qr/dnn/h5exNxvVX+7PP+0+wNHmLdGKsD/x/sLgSx3Kbn7xyZ7sJdqF6gljuU3P3jkz3YS7UL1BLHcpufvHJnuwl2n1lQyzU2m6qruau9QGAbT60WHNO5aVMkDw8Z8Ca8I3Ow435o0Jpw1GzqB40gRJER4m/xJc0dlWYySQfOI40L7G3fj4CVf1Bph7odWo3D8aHgkZgeo2eoRGfXAGWQNaJnDqiGCIiI4opS0qMkJ0M3N8efWlsAl3mRLc6u5/fx6uT+GT4rtWAtvzbydvBSBqcYaw8odeOa8IkWBZz0FiOrY5s1iFSVJ6ANmF4NTPQmBjoMMF/1CmFeTH86cLLy+bkLbCq46i9JdsueCrwxDlo5tnvn8jZeL2T24AqW+28BSLeE8SS+Y/cAEuisp6qyPQjMySkTDigP0/NeaTgK0VJlUzg0FeVPv22vuh2U0w8YVFDdyHspxRQaoJXzZhg5WWkjNrqhn4PbVpyh5imtICJ0Zgeo2erTlDzFNaQETozA9Rs9WnKHluU4gInRmB6i6BnvPuKQOqzNeNqxV5LMtwc7QfJQlYq8lmW4OdoPkoSsVeROu/rREZlKCzFNaQEDsBLiUrbWaV7rpPFfygaFfCM5vLiA7FjZJjGhMdy7hipcEjWC4/hUAgCrcvVWv1Jsdpb8LJSJDXMmFWWeWbbwldgHSReUND+wAgQ3g+csLNuNHQtlUvv9JVmccSkUo7XaXkks/XrApiDwI0r//zSB08dchZKydQwQpayHD4vBb6/Pakuq20JLpqbH3cN7ZGk+xSvrpfndKdP86ZwNVOtKbo7dLaCO4QoRW8Bsq7VmG6RSwZRc/HQoIzSjYdRWCmIPAXlX12OSOi+DXO9d6Nt8j4N/9DBC7xXjfbz2RvD9zHldEDjQFOH1lwQOiDUzqKwUxB4EaV+DytkUM4ubjuU3NnHj2a2Vbo1nUaYe6HZTTD3Q7KaYe6HZTTD3Q7O1BF9KmE2LHrFQupB+mjCtBHnfhznIUW00w90OymmHuh2REPjnbQ9Gz1acoeI25PLuBEyBrPSPUXdBHEJ9y7LZUQIz4TJUgu+WZ/hL8bgWcus3UDSqNw8Fb44rBh+zu+KypAM+zQQeBGmHuh2U0w8wJcqFD+JDxXPOib1X7SsJ82Pcs385W/N1Yl5KlUkwE4sgll6ffaJ1Fvlovbx0wZUHgRph7odlNMPc9FfZY9lVxAcRrgwxEAl+gRtXECotvUNwHI5BijY 무료\u003c/strong>이고, \u003cstrong>컬러 출력·복사는 결제카드를 등록한 뒤 유료(A4 100원 · A3 200원, VAT 별도)\u003c/strong>로 이용할 수 있어요. 컬러는 출력할 때 등록한 카드로 바로 결제되고, 컬러로 출력된 매수만큼만 결제돼요.\u003c/p>\n\u003col class=\"steps\">\n\u003cli>\u003cstrong>문서관리 시스템 접속\u003c/strong> · PC에서 \u003ca href=\"https://print.fastfive.co.kr\" target=\"_blank\" rel=\"noopener\">print.fastfive.co.kr\u003c/a>에 로그인해요.\u003c/li>\n\u003cli>\u003cstrong>카드관리\u003c/strong> · 우측 상단 \u003cspan class=\"path\">설정\u003c/span> &gt; \u003cspan class=\"path\">카드관리\u003c/span> &gt; \u003cspan class=\"path\">등록\u003c/span>을 눌러요.\u003c/li>\n\u003cli>\u003cstrong>카드 정보 입력\u003c/strong> · 별칭을 입력하고 카드 유형(공용·개인)을 고른 뒤 \u003cspan class=\"path\">인증 요청\u003c/span>을 눌러요.\u003c/li>\n\u003cli>\u003cstrong>PG 결제카드 등록\u003c/strong> · 결제창에 카드 정보를 입력하고 확인하면 자동으로 등록돼요.\u003c/li>\n\u003cli>\u003cstrong>출력\u003c/strong> · 프린터를 \u003cstrong>Sindoh Cloud MPS (Color)\u003c/strong>로 선택해 인쇄하고 복합기에서 출입카드를 태그해요.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>카드 종류\u003c/th>\u003cth>누가 등록하나요\u003c/th>\u003cth>설명\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cstrong>입주사 공용(대표) 카드\u003c/strong>\u003c/td>\u003ctd>대표자 · 과금관리자\u003c/td>\u003ctd>등록하면 다른 멤버도 별도 카드 없이 컬러 출력 가능. 예: 별칭 “법인용(출력결제카드)”, 유형 [공용], \u003cem>입주사 대표카드로 지정\u003c/em> 체크\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>개인 카드\u003c/strong>\u003c/td>\u003ctd>모든 멤버\u003c/td>\u003ctd>본인 결제용으로 추가 등록 가능\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warn\">\u003cp>멤버는 계정 생성 후 \u003cstrong>최초 1회 ‘기본 결제카드 지정’\u003c/strong>이 필요해요. 여러 카드 중 컬러 출력 결제에 쓸 카드를 고르는 설정이에요.\u003c/p>\u003c/div>\n\u003ch3>결제는 이렇게 돼요\u003c/h3>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>설정\u003c/th>\u003cth>결제\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>흑백\u003c/td>\u003ctd>결제 팝업 없이 바로 출력\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>자동컬러 (복사)\u003c/td>\u003ctd>컬러로 출력된 페이지 수만큼 결제\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>풀컬러 (복사)\u003c/td>\u003ctd>모든 페이지를 컬러로 출력·결제\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>컬러·흑백 혼합 (프린트)\u003c/td>\u003ctd>컬러로 출력된 매수만 결제\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>결제 실패로 출력이 안 될 때\u003c/h3>\n\u003cp>\u003ca href=\"https://print.fastfive.co.kr\" target=\"_blank\" rel=\"noopener\">print.fastfive.co.kr\u003c/a> 로그인 후 \u003cspan class=\"path\">My info\u003c/span> &gt; \u003cspan class=\"path\">결제 이력\u003c/span>에서 \u003cstrong>결제실패\u003c/strong> 건을 \u003cstrong>재결제\u003c/strong>하면 다시 사용할 수 있어요.\u003c/p>", "quickLabel": "", "scope": "all", "keywords": "컬러 출력 결제 카드 등록 공용카드 대표카드 과금 재결제 결제실패 컬러복사 유료 요금 칼라", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "mfp-functions", "cat": "it", "title": "복사·스캔·팩스", "summary": "복합기에 출입카드를 태그한 뒤 메뉴 선택", "body": "\u003cfigure>\u003cimg src=\"data:image/webp;base64,UklGRvIzAABXRUJQVlA4IOYzAAAwWwGdASqAAp8BPpFCnEklpCMqppO8MVASCWc6wz8D4WNBvjGjz1eoBzjH7Hb4B00noAdM/+1GTz9yvT/5m/u/8B+MfcnUCcYfy/gx2Rv87wl+a2oj+U/zX0FY/XRag7vJJJPHF9svFLoGfn//pf2/2qNVL2B7Dv6/db70Of2kMkg5QKFo7bhBCBCY/HovQ8lIl7+hA5+/fvUNUBGS4D872b6S+EDXDZiOAneIHMZo7Iissrldr9lzA0mp2b3s6brk8mbm2c5dS0R+GRtUG+aa88LUEPrOr2utIBId0wdSHelrOK6h6af/NAR3/nimUPNKssDf0VWHosfvDJvZZE1tP392WfuJuXyElfPtS3N/ftHPB8G0O+jZNUc1QbPLssKW2TY35tTVcZ6wKQ1cik/J287NfFqLtMm5kIehQ4l2+//nv17GKkf/8/Ph9CNZo3BdUmqQbh2yqqJ6weJLDmDt2P3gARr/13rUGiNvtClIXG/y+ROp1C//7nnLITtZVhi0kb6baC7zcXWJy9Vl3Kh3lqUO4mC+Zvg+Mz3c3OKuP+A+7+blFpAJQcTWSUl5dYvgrA37jMLAXepcW7XK6SmXHYB/BvxhJxh/mSUF4Yhu17dOmCMOS3y4tR7aqpxcBZZnU1PQf9kRvVYZPZtLeBMb9nYyj03DJhaGDgOI/9w/PPBh+A9DAgJV2VzQQRcIvzcxjsSf95GOSXCkvREk70ZvtH3GIB5vMiWHQhVAboLwJ1RLiaPkpUTcJdrWR6HhlLBmXKpvXZxAoSPVK4vtb7xkG+qh3rKniduhR+egG47EKJpfXr/Ae2uGdL+mKu55ZEVswtHzVmLlBHPTGCyPdz94dMHU2lHQjNVk0OZLq1Ydua9ELraCKXjKFEcOK/Lb6FPeNKMxf1rjSg2XnWJvKPpNYuqrDuIauOxZPpJuNX6Edp5cWCihwosrr4TQHYhdEHOj9pDjVvmWZS+yAOoWu0Gbvhf8LGXywgAzvNLsJLAfmYvXZ6TBmdsqWTB7L0IInpFhmC9XjEHw5YL ong>\u003c/td>\u003ctd>송신면을 위로 올리고 \u003cspan class=\"path\">팩스\u003c/span> → 번호 입력 → \u003cspan class=\"path\">번호 추가\u003c/span> → \u003cspan class=\"path\">전송\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cp>스캔 메일이 안 보이면 \u003cstrong>스팸 메일함\u003c/strong>을 먼저 확인해 주세요. 이메일 주소는 print.fastfive.co.kr \u003cspan class=\"path\">설정\u003c/span> &gt; \u003cspan class=\"path\">이메일 변경\u003c/span>에서 바꿀 수 있어요. 주소에 띄어쓰기가 있으면 전송되지 않아요.\u003c/p>\u003c/div>\n\u003cdiv class=\"callout info\">\u003cp>복합기 비밀번호는 개인정보 보호를 위해 \u003cstrong>6개월마다 변경\u003c/strong>해야 해요. print.fastfive.co.kr에서 변경한 뒤 Sindoh Cloud MPS에 새 비밀번호로 다시 로그인해 주세요.\u003c/p>\u003c/div>", "quickLabel": "", "scope": "all", "keywords": "복사 스캔 팩스 USB 이메일 스캔 로그아웃 카드등록 비밀번호 변경 6개월", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-fax", "cat": "it", "title": "층별 팩스 번호", "summary": "B1층부터 13층까지 팩스 번호", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl num\">\u003cthead>\u003ctr>\u003cth>층\u003c/th>\u003cth>팩스 번호\u003c/th>\u003cth>층\u003c/th>\u003cth>팩스 번호\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>B1F\u003c/td>\u003ctd>02-6958-7951\u003c/td>\u003ctd>7F\u003c/td>\u003ctd>02-6958-7982\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2F\u003c/td>\u003ctd>02-6958-7952\u003c/td>\u003ctd>8F\u003c/td>\u003ctd>02-6958-7983\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3F\u003c/td>\u003ctd>02-6958-7953\u003c/td>\u003ctd>9F\u003c/td>\u003ctd>02-6958-7984\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4F\u003c/td>\u003ctd>02-6958-7954\u003c/td>\u003ctd>10F\u003c/td>\u003ctd>02-6958-8435\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5F\u003c/td>\u003ctd>02-6958-7955\u003c/td>\u003ctd>11F\u003c/td>\u003ctd>02-6958-8436\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6F\u003c/td>\u003ctd>02-6958-7981\u003c/td>\u003ctd>12F\u003c/td>\u003ctd>02-6958-8437\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>13F\u003c/td>\u003ctd>02-6958-8438\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "팩스 번호 fax 층별", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "mfp-trouble", "cat": "it", "title": "복합기 문제 해결", "summary": "출력이 안 될 때 확인할 것", "body": "\u003ch3>출력 요청한 문서가 복합기에 보이지 않아요\u003c/h3>\n\u003cul>\u003cli>출력 정보가 넘어오는 중일 수 있어요. \u003cstrong>10초 간격으로 새로고침\u003c/strong>해 주세요.\u003c/li>\u003cli>PC에서 \u003cstrong>Sindoh Cloud MPS에 로그인\u003c/strong>되어 있는지 확인해 주세요.\u003c/li>\u003cli>프린터를 \u003cstrong>Sindoh Cloud MPS (Black/Color)\u003c/strong>로 선택했는지 확인해 주세요.\u003c/li>\u003cli>보안·백신 프로그램이 막을 수 있어요. 잠시 종료 후 다시 시도해 주세요.\u003c/li>\u003cli>\u003cstrong>복합기가 있는 층과 같은 층의 Wi-Fi\u003c/strong>에 연결되어야 해요. (예: 3층 복합기 → fastfive_3F_5G)\u003c/li>\u003c/ul>\n\u003ch3>‘출력’을 누르면 문서가 사라져요\u003c/h3>\n\u003cul>\u003cli>PC가 절전 모드이거나 꺼져 있으면 출력되지 않아요. PC 전원을 확인해 주세요.\u003c/li>\u003cli>Sindoh Cloud MPS 로그인 상태를 확인해 주세요.\u003c/li>\u003c/ul>\n\u003ch3>트레이에 용지가 없다고 나와요\u003c/h3>\n\u003cp>인쇄 설정의 용지 크기가 \u003cstrong>A4\u003c/strong>인지 확인해 주세요. \u003cem>Letter\u003c/em>로 설정되면 발생하는 오류예요.\u003c/p>\n\u003ch3>‘존재하지 않는 아이디 혹은 잘못된 비밀번호’가 떠요\u003c/h3>\n\u003cp>print.fastfive.co.kr 로그인 화면의 \u003cspan class=\"path\">비밀번호 찾기\u003c/span>에서 이메일 인증으로 가입 여부를 확인하거나 임시 비밀번호를 받을 수 있어요. 인증이 안 되면 앱에서 \u003ca href=\"#mfp-start\">복합기 계정 등록\u003c/a>부터 진행해 주세요.\u003c/p>\n\u003ch3>Mac에서 양면 인쇄가 안 돼요\u003c/h3>\n\u003cp>인쇄 창의 \u003cspan class=\"path\">레이아웃/피니싱\u003c/span> 탭에서 인쇄 종류를 \u003cstrong>양면\u003c/strong>으로 선택해 주세요. Mac은 OS를 최신 버전으로 업데이트하면 더 안정적으로 출력돼요.\u003c/p>\n\u003cdiv class=\"callout info\">\u003cp>해결되지 않으면 신도리코 고객센터 \u003cstrong>1588-5850\u003c/strong> (평일 09:00–18:00) 또는 지점 1:1 문의로 알려 주세요.\u003c/p>\u003c/div>", "quickLabel": "", "scope": "all", "keywords": "복합기 오류 안됨 출력안됨 문서 사라짐 용지 A4 letter 로그인 오류 비밀번호 양면 맥 mac 트러블", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-mail", "cat": "life", "title": "우편·택배", "summary": "1층 메일룸·보관함, 기타란에 철문 비밀번호 필수", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>우편물\u003c/th>\u003ctd>1층 \u003cstrong>메일룸\u003c/strong>에서 수령\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>택배\u003c/th>\u003ctd>1층 \u003cstrong>택배 보관함\u003c/strong>에서 수령\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>퀵·등기·카드류\u003c/th>\u003ctd>직접 수령해 주세요 (매니저 대리 수령 불가)\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warn\">\u003cp>\u003cstrong>지점에서 택배를 따로 맡아 보관해 드리지 않아요.\u003c/strong> 1층 택배 보관함에서 직접 찾아가 주시고, 받을 사람이 없을 때는 수령 일정을 미리 조정해 주세요.\u003c/p>\u003c/div>\n\u003ch3>배송 주소 적는 법\u003c/h3>\n\u003cp>주소에 \u003cstrong>회사명, 층, 사무실 호수\u003c/strong>를 꼭 함께 적어 주세요.\u003c/p>\n\u003cp class=\"example\">서울 강남구 테헤란로77길 11-15, \u003cspan class=\"c-accent\">\u003cstrong>○층 ○○○호 ㈜회사명\u003c/strong>\u003c/span>\u003c/p>\n\u003ch3>배송 메모(기타란) 필수 기재\u003c/h3>\n\u003cp>택배를 주문할 때 배송 요청사항의 \u003cspan class=\"c-accent\">\u003cstrong>기타란(배송 메모)\u003c/strong>\u003c/span>에 아래 내용을 \u003cstrong>반드시\u003c/strong> 적어 주세요. 기사님이 주차장 쪽 출입문으로 들어올 때 필요해요.\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>주차장 쪽 출입문(철문) 비밀번호\u003c/th>\u003ctd>\u003cstrong class=\"c-accent\">550401#\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>함께 적을 내용\u003c/th>\u003ctd>회사명, 층, 사무실 호수\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"example\">기타란 예시: \u003cstrong>○층 ○○○호 ㈜회사명 / 주차장 철문 비밀번호 550401#\u003c/strong>\u003c/p>\n\u003cdiv class=\"callout warn\">\u003cp>기타란에 적지 않으면 기사님이 건물에 들어오지 못해 \u003cstrong>배송이 지연되거나 반송\u003c/strong>될 수 있어요.\u003c/p>\u003c/div>", "quickLabel": "우편·택배", "scope": ["seolleung5"], "keywords": "우편 택배 등기 퀵 메일룸 보관함 보관 맡아 대리수령 주소 배송 수령 기타란 배송메모 철문 비밀번호 출입문", "quick": true, "icon": "box", "visible": true, "updated": "2026-10-24"}, {"id": "s5-trash", "cat": "life", "title": "분리배출·대형 폐기물", "summary": "박스는 펼쳐서 1층 주차장, 대형은 태화용역", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>품목\u003c/th>\u003cth>배출 방법\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cstrong>종이 박스\u003c/strong>\u003c/td>\u003ctd>테이프를 제거하고 \u003cstrong>납작하게 펼쳐서\u003c/strong> 1층 지상 주차장(차단기 옆)의 검은색 PP박스 또는 각 층 쓰레기통 옆에 접어 배출\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>플라스틱·스티로폼\u003c/strong>\u003c/td>\u003ctd>작게 잘라 일반 쓰레기로 배출\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>일반 분리수거\u003c/strong>\u003c/td>\u003ctd>각 층 캔틴바 분리수거함 이용\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>대형 폐기물\u003c/strong>\u003cbr>(가구·가전·화분 등)\u003c/td>\u003ctd>태화용역 \u003cstrong>1522-3833\u003c/strong>에 직접 접수 → 물품에 호실 번호·입주사명 기재 → 업체가 요청한 위치에 배출\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warn\">\u003cp>CCTV로 확인되는 구역이에요. 박스를 펼치지 않고 통째로 버리면 \u003cstrong>수거 요청 연락\u003c/strong>을 드릴 수 있어요.\u003c/p>\u003c/div>", "quickLabel": "분리배출", "scope": ["seolleung5"], "keywords": "쓰레기 분리수거 분리배출 박스 폐기물 대형 가구 스티로폼 플라스틱 태화용역", "quick": true, "icon": "trash", "visible": true, "updated": "2026-10-24"}, {"id": "s5-cleaning", "cat": "life", "title": "청소 일정", "summary": "층별 주 1회, 라운지 등 공용부는 매일", "body": "\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003cthead>\u003ctr>\u003cth>요일\u003c/th>\u003cth>정기 청소 층\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>월\u003c/td>\u003ctd>7층, 10층, 13층\u003c/td>\u003c/tr>\u003ctr>\u003ctd>화\u003c/td>\u003ctd>2층, 11층\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수\u003c/td>\u003ctd>4층, 8층, 12층\u003c/td>\u003c/tr>\u003ctr>\u003ctd>목\u003c/td>\u003ctd>3층, 6층\u003c/td>\u003c/tr>\u003ctr>\u003ctd>금\u003c/td>\u003ctd>5층, 9층\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>정기 청소 때 바닥 청소와 \u003cstrong>패스트파이브 제공 휴지통(검은색)\u003c/strong> 비움이 진행돼요.\u003c/li>\u003cli>라운지 등 공용부는 매일 청소해요.\u003c/li>\u003cli>휴지통을 매일 비우거나 청소 횟수를 늘리고 싶다면 \u003ca href=\"#svc-cleaning\">유료 추가 서비스\u003c/a>를 이용할 수 있어요.\u003c/li>\u003cli>추가 휴지통 비움은 \u003cstrong>호실 문의 QR\u003c/strong>로 접수해 주세요. 당일 16:30까지 접수된 건은 다음 날 오전에 비워 드려요.\u003c/li>\u003c/ul>\n\u003cdiv class=\"callout warn\">\u003cp>변기 수압이 약해 쉽게 막혀요. \u003cstrong>휴지 등은 꼭 휴지통에\u003c/strong> 버리고, 변기에는 어떤 이물질도 넣지 말아 주세요.\u003c/p>\u003c/div>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "청소 휴지통 비움 QR 요일 화장실 변기 막힘", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-moving", "cat": "life", "title": "이사·방문객", "summary": "평일 정해진 시간에 이사, 방문객은 직접 동행", "body": "\u003ch3>이사할 때\u003c/h3>\n\u003cp>날짜와 시간을 \u003cstrong>미리 매니저에게 알려 주세요\u003c/strong>. 출퇴근 시간과 겹치면 엘리베이터 이용이 어려울 수 있어요.\u003c/p>\n\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tbl\">\u003ctbody>\n\u003ctr>\u003cth>평일\u003c/th>\u003ctd>08:00 – 09:00 · 10:30 – 12:00 · 14:00 이후 (이사 차량은 매니저에게 시간 공유 필수)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>주말\u003c/th>\u003ctd>이사 가능\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>차량 없는 간편 이사\u003c/th>\u003ctd>시간 제한 없음\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>방문객\u003c/h3>\n\u003cp>방문객은 \u003cstrong>직접 동행해 안내\u003c/strong>해 주세요. 방문객 주차는 불가하며, Wi-Fi는 Guest 네트워크를 안내해 주세요.\u003c/p>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "이사 엘리베이터 방문객 손님 주차 이삿짐", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "s5-smoking", "cat": "life", "title": "흡연", "summary": "건물 내·외부 전 구역 금연, 전자담배 포함", "body": "\u003cdiv class=\"callout warn\">\u003cp>선릉5호점은 \u003cstrong>건물 내·외부 모든 공간이 금연 구역\u003c/strong>이에요. 주차장 전 구역, 지상층 외부, 화장실도 포함되며 \u003cstrong>전자담배도 불가\u003c/strong>해요.\u003c/p>\u003c/div>\n\u003cp>흡연이 필요하면 \u003cstrong>건너편 GS25 편의점 옆 골목\u003c/strong>을 이용해 주세요.\u003c/p>\n\u003cp class=\"c-muted\">무단 흡연으로 화재나 손해가 발생하면 모든 책임은 해당 입주사에 있어요.\u003c/p>", "quickLabel": "", "scope": ["seolleung5"], "keywords": "흡연 담배 전자담배 금연 흡연장소 흡연구역", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "etiquette", "cat": "life", "title": "이용 에티켓", "summary": "공용 공간을 위한 8가지 약속", "body": "\u003cfigure>\u003cimg s 룸, 라운지, 폰부스 등 공용 시설은 사용 후 \u003cstrong>깨끗하게 정리\u003c/strong>해 주세요.\u003c/li>\n\u003cli>건물 금연 방침에 따라 필요하면 \u003cstrong>정해진 흡연 장소\u003c/strong>를 이용해 주세요.\u003c/li>\n\u003cli>커뮤니티 매니저에게 욕설이나 성적 발언으로 수치심을 주는 행위는 \u003cstrong>제재 대상\u003c/strong>이 될 수 있어요.\u003c/li>\n\u003c/ol>", "quickLabel": "", "scope": "all", "keywords": "에티켓 매너 규칙 소음 통화 정리 공용공간", "quick": false, "icon": "", "visible": true, "updated": "2026-10-24"}, {"id": "inquiry", "cat": "help", "title": "1:1 문의", "summary": "앱 홈 › 1:1 문의하기 · 평일 09:30–17:30", "body": "\u003col class=\"steps\">\u003cli>\u003cstrong>홈 탭\u003c/strong> · 앱 하단의 \u003cspan class=\"path\">홈\u003c/span>을 눌러요.\u003c/li>\u003cli>\u003cstrong>1:1 문의하기\u003c/strong> · “궁금한 점이 있으신가요?” 카드를 눌러요.\u003c/li>\u003cli>\u003cstrong>내용 작성\u003c/strong> · 지점명, 서비스 영역, 문의 내용을 입력하고 필요하면 사진을 첨부해요.\u003c/li>\u003cli>\u003cstrong>등록\u003c/strong> · 등록하면 문의 내역에서 답변을 확인할 수 있어요.\u003c/li>\u003c/ol>\n\u003cfigure>\u003cimg src=\"data:image/webp;base64,UklGRrJrAABXRUJQVlA4IKZrAACwLAKdASpQAygDPpVInkulpCMioxN7QLASiWdu+DV3EYAK8+yk/H/6jr++DnnBofEWKAdMbytECh8/cf3307+SfGOOhm89SPif8X1ZfrL2BOeL5lPN59Kf9/9FD0tvVd9Cnpff8Vkx/pn/EemfwW/E/4f/H/8b/Aenf5H9R/lv77+5n+N92nJf2T/TXqZ/NfwP+q/uf5JfNL+X/7H+h8Wflf/jfdR8gv5r/Sv9l9yXx7/d/tD3ju6f7j/i/6z2BfZj7J/zv8t42X+z/jvVX7F/9v/M/5f5AP5//W/+L/hfcb/i+Ez+O/4/7ZfAL/Rf8T/6P8j+bf02f4n/x/3X+3/eb3efW3/w/2XwI/sD/5OyV6URVT093Ag+4Mu//9fyremRNw2Mi8YCs1MzqwFIoofhRxmnEuBttzlbDaQmGBfvgD7D34qiDe2Nct7mOzUzOrAVrj5l5UVrxQIhJSBDqBSe9dNJvxI+p5fL/+ma9pRMRlGU7NjaZboCs2NNBE+2kXxT1p7jXtmZ7nU5GuLt2Zji95SMDC+oVk98QxvacmPqddTCKOUaCvOXSlCDZrc+gHjfBnt0wpW8JarwPG5wYvEAx8HbHKudrCbsCE+LPSu5DVe9QG/m2+ffjcGe2fT9PHC1BEytOFysZyXF3aHQ39wSOO8T8R4bRlS2+BnoerhqyIYommqe2BIwQEoqo8D5TNtSchkwyYZLsCSP81FwuZcaAY4Lk0tak7ndUs1j4pnYl3VD021ytLfwvbQYV2k5e/Fvi3x9qYNarcwuR5M7SyeEkWRMIZs+EIUbwTaZWlE5vvkMn+iyZfOG88rdExIfZHi/x+1Mng/+5Vbo2BG2kiBdm9LSVIeXQx/uNQZkbGAYULj/8NOsv6Jtpo0MvSiV2QDUYpM25AvzGfziZx4W04DYbSic33yGTDH5kdGteLgSb3jtThc4fOQwqTpoWTrZ1aJr4bSiWC6TJoG6smHQCraRoFlxMxDCLP82sEmMzy4bDr ds": "미팅룸 회의실 예약 크레딧", "answer": "\u003cp>앱 \u003cstrong>예약 탭\u003c/strong>에서 지점·날짜를 고르고 공간과 시간을 선택하면 돼요. 이용하지 않으면 내 계정 › 예약 내역에서 꼭 취소해 주세요.\u003c/p>", "article": "meeting-reserve", "scope": "all"}, {"id": "f6", "q": "택배는 어디서 받아요?", "keywords": "택배 우편 등기 퀵 메일룸 보관함", "answer": "\u003cp>우편물은 \u003cstrong>1층 메일룸\u003c/strong>, 택배는 \u003cstrong>1층 택배 보관함\u003c/strong>에서 받아요. 주문할 때 배송 메모 \u003cstrong>기타란\u003c/strong>에 회사명·층·호수와 주차장 철문 비밀번호 \u003cstrong>550401#\u003c/strong>을 꼭 적어 주세요. 퀵·등기는 직접 수령해야 해요.\u003c/p>", "article": "s5-mail", "scope": ["seolleung5"]}, {"id": "f7", "q": "박스는 어디에 버려요?", "keywords": "박스 쓰레기 분리수거 분리배출 폐기물", "answer": "\u003cp>테이프를 떼고 \u003cstrong>납작하게 펼쳐\u003c/strong> 1층 지상 주차장 검은색 PP박스나 각 층 쓰레기통 옆에 접어 두세요. 대형 폐기물은 태화용역(1522-3833)에 직접 접수해요.\u003c/p>", "article": "s5-trash", "scope": ["seolleung5"]}, {"id": "f8", "q": "어디서 밥 먹을 수 있어요?", "keywords": "취식 식사 점심 음식 먹어도", "answer": "\u003cp>서브 라운지와 사무공간은 \u003cstrong>24시간\u003c/strong>, B1·B2층 메인 라운지는 \u003cstrong>11:00–14:00\u003c/strong>에만 취식할 수 있어요. 미팅룸은 음료만 가능해요.\u003c/p>", "article": "s5-food", "scope": ["seolleung5"]}, {"id": "f9", "q": "담배 피울 곳이 있나요?", "keywords": "흡연 담배 전자담배 흡연구역", "answer": "\u003cp>건물 내·외부 전 구역(주차장 포함)이 금연이에요. 흡연은 \u003cstrong>건너편 GS25 편의점 옆 골목\u003c/strong>을 이용해 주세요.\u003c/p>", "article": "s5-smoking", "scope": ["seolleung5"]}, {"id": "f10", "q": "랜선이나 멀티탭을 빌릴 수 있나요?", "keywords": "랜선 멀티탭 대여 빌려 유선", "answer": "\u003cp>앱 \u003cstrong>1:1 문의하기\u003c/strong>로 필요한 품목과 수량을 알려 주시면 준비해 드려요. 대여한 비품이 파손·분실되면 비용이 청구돼요.\u003c/p>", "article": "inquiry", "scope": ["seolleung5"]}, {"id": "f11", "q": "매니저 근무시간이 궁금해요", "keywords": "매니저 근무 상담 시간 운영시간 연락", "answer": "\u003cp>커뮤니티 매니저는 \u003cstrong>평일 09:30–17:30\u003c/strong>에 근무해요. 긴급 상황은 시간 외에도 1:1 문의로 접수해 주세요.\u003c/p>", "article": "inquiry", "scope": "all"}, {"id": "f13", "q": "실물 출입카드를 잃어버렸어요", "keywords": "랜야드 실물 카드 분실 잃어버 재발급 카드키", "answer": "\u003cp>실물 출입카드(랜야드)는 현재 새로 발급하지 않고, 기존 카드를 분실하면 재발급 비용 \u003cstrong>33,000원(VAT 포함)\u003c/strong>이 청구돼요. 앱에서 \u003cstrong>모바일 출입카드\u003c/strong>를 발급해 사용해 주세요.\u003c/p>", "article": "card-issue", "scope": "all"}, {"id": "f14", "q": "패파머니가 뭐예요?", "keywords": "패파머니 크레딧 유료크레딧 충전 한도 잔액 전환", "answer": "\u003cp>11월 20일부터 \u003cstrong>유료 크레딧\u003c/strong>의 새 이름이에요. 기존 잔액은 같은 수량의 패파머니로 자동 전환되고 사용 방법도 그대로예요. 멤버그룹당 \u003cstrong>최대 180\u003c/strong>까지 보유할 수 있어요.\u003c/p>", "article": "credit", "scope": "all"}, {"id": "f15", "q": "흑백 출력은 무료인가요?", "keywords": "흑백 무료 200장 무제한 요금 가격 출력 복사 컬러 유료 초과 A3 A4", "answer": "\u003cp>흑백 출력·복사는 \u003cstrong>계약 데스크당 월 200장(A4 기준)\u003c/strong>이 무료예요. 예를 들어 10인실이면 월 2,000장이에요. 초과분은 A4 10원, A3 20원(VAT 별도)으로 월말 후불 청구되고, 스캔·팩스는 장수에 포함되지 않아요. 컬러는 A4 100원·A3 200원(VAT 별도)이고 결제카드 등록 후 즉시 결제돼요.\u003c/p>", "article": "mfp-start", "scope": "all"}, {"id": "f16", "q": "택배를 대신 받아 주시나요?", "keywords": "택배 보관 맡아 대신 대리 수령 부재", "answer": "\u003cp>지점에서 택배를 \u003cstrong>따로 맡아 보관하거나 대신 받아 드리지 않아요.\u003c/strong> 1층 택배 보관함에서 직접 찾아가 주세요. 퀵·등기·카드류도 직접 수령해야 해요.\u003c/p>", "article": "s5-mail", "scope": ["seolleung5"]}, {"id": "f17", "q": "가구를 빼거나 옮기면 비용이 드나요?", "keywords": "가구 반출 반입 이동 의자 책상 데스크 서랍장 비용 부가서비스", "answer": "\u003cp>입주·재계약 시 첫 세팅 1회는 무료이고, 그 외 이동은 책상 15,000원, 서랍 5,000원, 의자 15,000원(1개당, VAT 별도)이에요. 1:1 문의로 일정과 수량을 미리 알려 주세요.\u003c/p>", "article": "furniture-fee", "scope": "all"}, {"id": "f18", "q": "멀티탭이 고장 났어요", "keywords": "멀티탭 파손 고장 분실 랜선 대여 비품", "answer": "\u003cp>대여한 멀티탭·랜선이 \u003cstrong>파손되거나 분실되면 비용이 청구\u003c/strong>돼요. 고장이 났다면 1:1 문의로 상태를 알려 주세요.\u003c/p>", "article": "furniture-fee", "scope": "all"}, {"id": "f19", "q": "부가서비스는 뭐가 있나요?", "keywords": "부가서비스 고정ip 아이피 렌탈 모니터 노트북 창고 주차 청소 출입권한 가격", "answer": "\u003cp>고정 IP(월 50,000원), 전 지점 라운지 출입권한(월 250,000원), 가구·전자기기 렌탈, 휴지통 매일 비움, 바닥 청소 추가 등이 있어요. 금액은 VAT 별도이고, \u003cstrong>지점 운영 상황에 따라 달라질 수 있어\u003c/strong> 신청 전 1:1 문의로 확인해 주세요.\u003c/p>", "article": "furniture-fee", "scope": "all"}, {"id": "f20", "q": "모니터나 노트북을 빌릴 수 있나요?", "keywords": "모니터 노트북 렌탈 대여 빌려 맥북 그램 공기청정기", "answer": "\u003cp>네, 월 단위로 렌탈할 수 있어요. 24인치 모니터 월 15,000원부터 있고, 한 달이 안 돼도 한 달 분이 청구돼요(VAT 별도).\u003c/p>", "article": "svc-device-rental", "scope": "all"}, {"id": "f12", "q": "그룹 초대 링크가 없어요", "keywords": "그룹 초대 소속 승인 링크 가입", "answer": "\u003cp>사내 담당자나 지점 커뮤니티 매니저에게 \u003cstrong>그룹 초대\u003c/strong>를 요청해 주세요. 링크로 승인 요청 → 소속 확정 → 승인 완료 순으로 진행돼요.\u003c/p>", "article": "group-join", "scope": "all"}], "version": 1}</script>

function toast(msg,ms){var t=$('.toast');if(t)t.remove();t=h('<div class="toast" role="status">'+esc(msg)+'</div>');document.body.appendChild(t);clearTimeout(toast._t);toast._t=setTimeout(function(){t.remove()},ms||2600)}
function copyText(txt,btn){function ok(){toast('복사했어요: '+txt)}
  try{navigator.clipboard.writeText(txt).then(ok,function(){fallbackCopy(txt);ok()})}catch(e){fallbackCopy(txt);ok()}}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
function stripTags(html){var d=document.createElement('div');d.innerHTML=String(html||'').replace(/<img[^>]*>/g,'');return d.textContent||''}
function sanitize(html){var t=document.createElement('template');t.innerHTML=html||'';
  $$('script,iframe,object,embed,style,link,meta,form,input,button,textarea,select',t.content).forEach(function(n){n.remove()});
  $$('*',t.content).forEach(function(el){Array.prototype.slice.call(el.attributes).forEach(function(a){var n=a.name.toLowerCase();
    if(n.indexOf('on')===0||n==='contenteditable'||n==='style'&&el.tagName!=='SPAN')el.removeAttribute(a.name);
    if((n==='href'||n==='src')&&/^\s*(javascript|vbscript):/i.test(a.value))el.removeAttribute(a.name)});
    if(el.tagName==='A'&&/^https?:/i.test(el.getAttribute('href')||'')){el.setAttribute('target','_blank');el.setAttribute('rel','noopener')}});
  return t.innerHTML}

function tokens(text){return String(text||'').toLowerCase().replace(/[?!.,~·()\[\]{}"'“”‘’:;/\\]/g,' ').split(/\s+/).filter(function(w){return w.length>=1&&STOP.indexOf(w)<0})}
function stems(w){var out=[w];if(w.length>=3)out.push(w.slice(0,-1));if(w.length>=4)out.push(w.slice(0,-2));return out}
function scoreText(qs,fields){var sc=0;qs.forEach(function(w){if(w.length<2&&!/[a-z0-9]/.test(w))return;stems(w).some(function(st){if(st.length<2)return false;
  for(var i=0;i<fields.length;i++){if(fields[i][0].indexOf(st)>-1){sc+=fields[i][1]*(st===w?1:.7);return true}}return false})});return sc}

async function saveFile(name,text,type){var dl=null;if(IN_CLAUDE){try{dl=await window.claude.use('downloads')}catch(e){dl=null}}
  if(dl){try{await dl.save({filename:name,data:text});toast('파일 저장을 요청했어요')}catch(e){toast('파일을 저장하지 못했어요. JSON 복사를 이용해 주세요.')}return}
  if(IN_CLAUDE){toast('이 화면에서는 파일 저장을 쓸 수 없어요. JSON 복사를 이용해 주세요.',4000);return}
  try{var url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000)}catch(e){toast('파일을 저장하지 못했어요')}}
